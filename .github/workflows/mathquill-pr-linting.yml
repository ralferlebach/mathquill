# Builds, lints and tests MathQuill.
#
# The browser jobs always upload their full Playwright report — including
# videos and traces — on success as well as on failure, so a green run can
# be exported and reviewed. A job only fails on a real test failure:
# a mismatching assertion or a page that cannot be initialised.

name: mathquill pr linting

on:
  workflow_dispatch:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        node-version: [20.x, 22.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - run: make
      - run: make basic
      - run: make lint
      - run: npx prettier --check '**/*.{ts,js,css,html}'

  browser-tests:
    # Existing Mocha unit suite plus the Playwright baseline and matrix
    # suites, in Chromium.
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - run: npm ci
      - run: make test
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --project=chromium

      - name: Upload report (success)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-success-chromium-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: warn

      - name: Upload report (failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-chromium-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: warn

  cross-browser:
    # Firefox and WebKit: CSS table layout, focus handling, keyboard
    # events and delimiter scaling differ between engines.
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - run: npm ci
      - run: make test
      - run: npx playwright install --with-deps firefox webkit
      - run: npx playwright test --project=firefox --project=webkit

      - name: Upload report (success)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-success-cross-browser-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: warn

      - name: Upload report (failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-cross-browser-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: warn

  visual-regression:
    # Screenshot comparison against the reference images in
    # test/e2e/visual.spec.ts-snapshots/, which were produced by this job and
    # are committed. It is a gate: a layout change that is not intended fails
    # here. To accept an intended change, take the -actual images from this
    # job's artifact and commit them as the new references — do not generate
    # references on a developer machine.
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - run: npm ci
      - run: make test
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --project=visual

      - name: Upload visual report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-visual-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
            test/e2e/**/*-snapshots/
          retention-days: 14
          if-no-files-found: warn
